[project]
name = "poc-docker-deepagent"
version = "0.1.0"
description = "POC: Deep Agent + Docker sandbox served with FastAPI"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.15",
    "langchain-openai>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "docker>=7.1",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
